name: Linting

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ${{ matrix.image }}
    strategy:
      matrix:
        os:
          - Ubuntu
        python-version:
          - "3.14"
        include:
          - os: Ubuntu
            image: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      # For building pillow from source
      # - name: Install libjpeg headers
      #   run: sudo apt-get install libjpeg-dev
      #   if: matrix.python-version == '3.14'

      # For building pyodbc from source
      # - name: Install unixodbc headers
      #   run: sudo apt-get install unixodbc-dev
      #   if: matrix.python-version == '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Check lockfile
        run: uv lock --locked --offline

      - name: Install project
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: uv sync -p "$PYTHON_VERSION" --extra azure

      - name: Install ruff
        uses: astral-sh/ruff-action@0ce1b0bf8b818ef400413f810f8a11cdbda0034b # v4.0.0

      - name: ruff check
        run: ruff check .

      - name: ruff format
        run: ruff format --check .

      - name: mypy
        run: uv run mypy .

      - name: pytest
        run: uv run pytest
